<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Çaycı – Sipariş Paneli</title>
<style>
:root{--bg:#fbf5ea;--ink:#2b1a12;--mut:#8a7565;--red:#a8281c;--line:#eadfce;--ok:#2e7d4f;--gold:#d9a441}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
header{background:var(--red);color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px}button{font:inherit;cursor:pointer}
.w{max-width:720px;margin:0 auto;padding:14px}
.login{text-align:center;padding:60px 20px}.login button{background:var(--red);color:#fff;border:none;border-radius:14px;padding:14px 22px;font-weight:700;font-size:16px}
.tb{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px}.tb.new{border:2px solid var(--red)}
.th{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}.th b{font-size:22px}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:#efe2cd}.tag.g{background:#d8f0e0;color:var(--ok)}.tag.r{background:#fde0dc;color:var(--red)}.tag.y{background:#fff1cc;color:#8a6200}
.o{border-top:1px dashed var(--line);padding:10px 0}.o small{color:var(--mut)}.it{font-size:17px;font-weight:600;margin:2px 0}
.ac{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.ac button{border:none;border-radius:10px;padding:9px 14px;font-weight:700;background:#efe2cd;color:var(--ink)}.ac button.p{background:var(--ok);color:#fff}.ac button.d{background:var(--ink);color:#fff}
.sum{font-weight:800;color:var(--red)}.hint{color:var(--mut);text-align:center;padding:30px}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font-weight:700}.tabs button.on{background:var(--ink);color:#fff}
input{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);font-size:16px;margin:4px 0 8px}
.cu{cursor:pointer;display:flex;justify-content:space-between;align-items:center}.lg{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.pos{color:var(--red);font-weight:700}.neg{color:var(--ok);font-weight:700}
.pl{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:14px}.pl .z{font-size:12px;font-weight:800;letter-spacing:.06em;margin:6px 0}.pl .g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}.pl .m{border:1.5px solid var(--line);background:#f4f4f2;border-radius:14px;padding:10px 4px;text-align:center;font-weight:800;font-size:18px;color:#999}.pl .m small{display:block;font-size:11px;font-weight:600}.pl .m.n{background:var(--red);border-color:var(--red);color:#fff}.pl .m.h{background:#f5b301;border-color:#f5b301;color:#222}.pl .m.k{background:#2e7d32;border-color:#2e7d32;color:#fff}.pl .m{position:relative}.pl .ad{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:99px;border:none;background:rgba(0,0,0,.15);color:inherit;font-size:18px;font-weight:800;line-height:1;padding:0}#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none}#ov .bx{position:absolute;inset:auto 0 0 0;max-height:88vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:16px}#ov .r{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}#ov .r span{flex:1}#ov .r button{width:36px;height:36px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:20px;font-weight:700}#ov .r b{width:22px;text-align:center}#ov .go{width:100%;margin-top:12px;padding:14px;border:none;border-radius:14px;background:var(--red);color:#fff;font-weight:700;font-size:16px}#ov .go:disabled{opacity:.4}body.st .ow{display:none!important}.mi{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.mi span{flex:1}.mi input[type=text],.mi input:not([type]){width:84px;margin:0;padding:8px}</style></head><body>
<header><h1>Çaycı · Sipariş Paneli</h1><span id="who" style="font-size:12px;opacity:.9"></span></header>
<div class="w" id="w"><div class="login"><p>Giriş yap</p><button id="in">Google ile giriş</button><div style="margin:18px 0 6px;font-size:13px">veya çalışan PIN</div><input id="pn" inputmode="numeric" maxlength="6" placeholder="6 haneli PIN" style="text-align:center"><button id="pg">PIN ile gir</button><div id="e" style="color:var(--red);margin-top:12px;font-size:13px"></div></div></div>
<script type="module">
import {firebaseConfig} from './common.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,signInAnonymously,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,collection,query,orderBy,onSnapshot,doc,updateDoc,deleteDoc,setDoc,runTransaction,addDoc,serverTimestamp,getDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const TL=n=>(n||0).toLocaleString('tr-TR',{maximumFractionDigits:2})+' ₺',KR=10;
const fk=n=>(Math.round(n*100)/100).toLocaleString('tr-TR')+' kontör';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=v=>String(v||'').replace(/\D/g,'').slice(-10);
const PRICE0={'İnce Belli Bardak Çay':10,'Karton Bardak Çay':20,'Türk Kahvesi':60,'Nescafe':30,'Sahlep':30,'Ihlamur':40,'Adaçayı':40,'Kış Çayı':45,'Nane Limon':40,'Su':20,'Maden Suyu':30,'Limonlu Maden Suyu':35,'Ayran':25,'Limonata':20,'Avşar Meyve Suyu':40,'Karışık Meyve Nektarı':25,'Simit':25,'Kaşarlı Tost':70,'Poğaça':30};
let PRICE={...PRICE0},MO={p:{},off:{},add:[]},STAFF=[],PINS=[],role=null;const OWNER='acartoplu@gmail.com';
function rebuildP(){PRICE={...PRICE0};MO.add.forEach(a=>PRICE[a.n]=a.p);Object.assign(PRICE,MO.p||{})}
const mkeys=()=>Object.keys(PRICE).filter(k=>!(MO.off||{})[k]);
const ip=i=>i.p!=null?i.p:(PRICE[i.n]||0);
let dayStr=new Date().toLocaleDateString('sv-SE'),docs=[],custs=[],view='open',first=true,unsubs=[],selId=null;
const byPhone=p=>custs.find(c=>c.phone===p);
document.addEventListener('change',e=>{if(e.target.id==='dpick'&&e.target.value){dayStr=e.target.value;draw()}});
let addT=null,addQ={};
function ovDraw(){let ov=document.getElementById('ov');if(!ov){ov=document.createElement('div');ov.id='ov';document.body.appendChild(ov)}
 if(!addT){ov.style.display='none';return}
 const n=Object.values(addQ).reduce((s,q)=>s+q,0),tot=Object.entries(addQ).reduce((s,[k,q])=>s+q*PRICE[k],0);
 ov.style.display='block';ov.innerHTML=`<div class="bx"><div class="th"><b>Masa ${esc(addT)} · sipariş ekle</b><button data-a="ovx|" style="border:none;background:none;font-size:26px">×</button></div>`+mkeys().map(k=>`<div class="r"><span>${esc(k)} <small>${TL(PRICE[k])}</small></span><button data-q="-|${esc(k)}">−</button><b>${addQ[k]||0}</b><button data-q="+|${esc(k)}">+</button></div>`).join('')+`<button class="go" data-a="ovgo|" ${n?'':'disabled'}>Siparişi ekle · ${TL(tot)}</button></div>`}
document.addEventListener('click',async e=>{const t=e.target.closest('button');
 if(t&&t.dataset.add){addT=t.dataset.add;addQ={};ovDraw();return}
 if(t&&t.dataset.q){const [s,k]=t.dataset.q.split('|');addQ[k]=Math.max(0,(addQ[k]||0)+(s==='+'?1:-1));if(!addQ[k])delete addQ[k];ovDraw();return}
 if(t&&t.dataset.a==='ovx|'){addT=null;ovDraw();return}
 if(t&&t.dataset.a==='ovgo|'){t.disabled=true;const items=Object.entries(addQ).map(([n,q])=>({n,q,p:PRICE[n]}));const total=items.reduce((s,i)=>s+i.q*i.p,0);try{await addDoc(collection(db,'orders'),{type:'order',no:'#'+(100+Math.floor(Math.random()*900)),table:addT,items,total,paid:false,payType:'later',phone:'',status:'new',createdAt:serverTimestamp()});addT=null;ovDraw()}catch(x){alert('Eklenemedi: '+x.message);t.disabled=false}return}
 const cu=e.target.closest('[data-cu]');if(cu){selId=cu.dataset.cu;draw();return}
 if(!t)return;
 if(t.id==='pg'){const em=document.getElementById('e'),pin=document.getElementById('pn').value.trim();if(!/^\d{6}$/.test(pin)){em.textContent='6 haneli PIN yaz.';return}try{em.textContent='';const c=await signInAnonymously(auth);await setDoc(doc(db,'sessions',c.user.uid),{pin,at:Date.now()});location.reload()}catch(x){try{await signOut(auth)}catch(_){}setTimeout(()=>{const e2=document.getElementById('e');if(e2)e2.textContent='PIN yanlış.'},400)}return}if(t.id==='in'){const gp=new GoogleAuthProvider();gp.setCustomParameters({prompt:'select_account'});const em=document.getElementById('e');try{await signInWithPopup(auth,gp)}catch(x){if(x.code==='auth/cancelled-popup-request'){return}try{em.textContent='Yönlendiriliyor…';await signInWithRedirect(auth,gp)}catch(y){em.textContent='Giriş yapılamadı: '+(y.code||x.code)}}}
 else if(t.id==='out')signOut(auth)
 else if(t.id==='dprev'||t.id==='dnext'){const d=new Date(dayStr+'T12:00:00');d.setDate(d.getDate()+(t.id==='dnext'?1:-1));dayStr=d.toLocaleDateString('sv-SE');draw()}
 else if(t.dataset.v){view=t.dataset.v;selId=null;draw()}
 else if(t.id==='back'){selId=null;draw()}
 else if(t.id==='addC'){const n=document.getElementById('nn').value.trim(),p=P(document.getElementById('np').value),k=parseFloat(String(document.getElementById('nk').value).replace(',','.'))||0;
  if(n.length<2||p.length!==10){alert('Ad soyad ve 10 haneli telefon gir.');return}
  if(byPhone(p)){alert('Bu telefon zaten kayıtlı.');return}
  const id='c'+Date.now().toString(36);await setDoc(doc(db,'customers',id),{id,name:n,phone:p,k,ledger:k>0?[{t:new Date().toISOString(),d:'Başlangıç kontörü',a:k}]:[]})}
 else if(t.id==='vere'){const c=custs.find(x=>x.id===selId),a=parseFloat(String(document.getElementById('va').value).replace(',','.')),nt=document.getElementById('vn').value.trim();if(!c||!(a>0))return;
  if(c.k-a<-(c.limit||0)&&!confirm('Bu işlem üyenin hakkını aşıyor ('+fk(c.k-a)+'). Yine de düşülsün mü?'))return;
  await updateDoc(doc(db,'customers',c.id),{k:Math.round((c.k-a)*100)/100,ledger:(c.ledger||[]).concat([{t:new Date().toISOString(),d:'Veresiye'+(nt?' · '+nt:''),a:-a}]).slice(-100)})}
 else if(t.id==='setlim'){const c=custs.find(x=>x.id===selId),a=parseFloat(String(document.getElementById('li').value).replace(',','.'));if(!c||!(a>=0))return;await updateDoc(doc(db,'customers',c.id),{limit:a})}
 else if(t.id==='load'){const c=custs.find(x=>x.id===selId),a=parseFloat(String(document.getElementById('la').value).replace(',','.'));if(!c||!(a>0))return;
  await updateDoc(doc(db,'customers',c.id),{k:Math.round((c.k+a)*100)/100,ledger:(c.ledger||[]).concat([{t:new Date().toISOString(),d:'Kontör yükleme',a}]).slice(-100)})}
 else if(t.dataset.a&&/^(msave|madd|mdel|sadd|sdel|sadm|padd|pdel|padm)\|/.test(t.dataset.a)){const [a,id]=t.dataset.a.split('|');if(role!=='owner')return;try{
  if(a==='msave')await msave();
  else if(a==='madd'){const n=document.getElementById('mnn').value.trim(),v=parseFloat(String(document.getElementById('mnp').value).replace(',','.')),c=document.getElementById('mnc').value;if(!n||!(v>=0)||PRICE[n]!=null){alert('Ad boş ya da ürün zaten var, fiyat sayı olmalı.');return}await setDoc(doc(db,'menu','main'),{p:MO.p||{},off:MO.off||{},add:MO.add.concat([{c,n,p:v}])});document.getElementById('mnn').value='';document.getElementById('mnp').value=''}
  else if(a==='mdel'){const k=Object.keys(PRICE)[+id];if(confirm(k+' silinsin mi?'))await setDoc(doc(db,'menu','main'),{p:MO.p||{},off:MO.off||{},add:MO.add.filter(x=>x.n!==k)})}
  else if(a==='sadd'){const e=document.getElementById('se').value.trim().toLowerCase(),n=document.getElementById('sn').value.trim();if(!/^\S+@\S+\.\S+$/.test(e)){alert('Geçerli bir e-posta yaz.');return}await setDoc(doc(db,'staff',e),{name:n});document.getElementById('se').value='';document.getElementById('sn').value=''}
  else if(a==='sadm'){const cur=STAFF.find(z=>z.id===id);const on=!(cur&&cur.admin);if(confirm(id+(on?' yönetici yapılsın mı? Senin tüm yetkilerin olacak.':' yöneticilikten alınsın mı?')))await setDoc(doc(db,'staff',id),{admin:on},{merge:true})}else if(a==='padd'){const n=document.getElementById('pnm').value.trim();if(!n){alert('Çalışanın adını yaz.');return}let pin;do{pin=String(Math.floor(100000+Math.random()*900000))}while(PINS.some(z=>z.id===pin));await setDoc(doc(db,'pins',pin),{name:n});document.getElementById('pnm').value=''}else if(a==='padm'){const cur=PINS.find(z=>z.id===id);const on=!(cur&&cur.admin);if(confirm((cur&&cur.name||'')+(on?' yönetici yapılsın mı? Panelde senin tüm yetkilerin olacak.':' yöneticilikten alınsın mı?')))await setDoc(doc(db,'pins',id),{admin:on},{merge:true})}else if(a==='pdel'){if(confirm('Bu PIN silinsin mi? Çalışanın girişi kapanır.'))await deleteDoc(doc(db,'pins',id))}else if(a==='sdel'){if(confirm(id+' ekipten çıkarılsın mı?'))await deleteDoc(doc(db,'staff',id))}
 }catch(x){alert('Olmadı: '+x.message)}}
 else if(t.dataset.a){const [a,id]=t.dataset.a.split('|');
  if(a==='done')await updateDoc(doc(db,'orders',id),{status:'done'});
  if(a==='del'&&confirm('Silinsin mi?'))await deleteDoc(doc(db,'orders',id));
  if(a==='tablepaid'){for(const d of docs.filter(d=>d.type==='order'&&d.table===id&&!d.paid&&d.payType!=='kontor'))await updateDoc(doc(db,'orders',d.id),{paid:true,status:'done'})}
  if(a==='kd'){const o=docs.find(d=>d.id===id),c=byPhone(o.phone);if(!c){alert('Bu numara üye değil: '+o.phone+'. Üyeler sekmesinden ekle.');return}
   const need=Math.round(o.total/KR*100)/100;
   try{await runTransaction(db,async tx=>{const cr=doc(db,'customers',c.id),s=await tx.get(cr),cd=s.data();if(cd.k+(cd.limit||0)+0.001<need)throw new Error('Kontör yetersiz: '+fk(cd.k)+' bakiye'+(cd.limit?' + '+fk(cd.limit)+' hak':'')+', '+fk(need)+' gerekli.');
    tx.update(cr,{k:Math.round((cd.k-need)*100)/100,ledger:(cd.ledger||[]).concat([{t:new Date().toISOString(),d:'Sipariş '+o.no+' · Masa '+o.table,a:-need}]).slice(-100)});tx.update(doc(db,'orders',id),{paid:true,status:'done'})})}catch(x){alert(x.message)}}
 }
});
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.2;o.start();setTimeout(()=>{o.stop();c.close()},350)}catch(_){}}
function dayView(){
 const os=docs.filter(d=>d.type==='order'&&new Date(d.ms).toLocaleDateString('sv-SE')===dayStr).sort((a,b)=>a.ms-b.ms);
 const tot=os.reduce((s,o)=>s+o.total,0),paid=os.filter(o=>o.paid),pT=paid.reduce((s,o)=>s+o.total,0),kT=os.filter(o=>o.payType==='kontor').reduce((s,o)=>s+o.total,0),prod={};
 os.forEach(o=>(o.items||[]).forEach(i=>{const r=prod[i.n]=prod[i.n]||{q:0,g:0};r.q+=i.q;r.g+=i.q*ip(i)}));const tq=Object.values(prod).reduce((s,r)=>s+r.q,0),tg=Object.values(prod).reduce((s,r)=>s+r.g,0);
 let h=`<div class="tb"><div class="th"><button id="dprev" style="border:none;background:#efe2cd;border-radius:10px;padding:8px 14px;font-weight:700">‹</button><input id="dpick" type="date" value="${dayStr}" style="margin:0;flex:1;text-align:center"><button id="dnext" style="border:none;background:#efe2cd;border-radius:10px;padding:8px 14px;font-weight:700">›</button></div>
 <div class="th" style="margin-top:10px"><span>Sipariş</span><b style="font-size:18px">${os.length}</b></div><div class="th"><span>Toplam ciro</span><b class="sum" style="font-size:18px">${TL(tot)}</b></div><div class="th"><span>Ödenen</span><b style="font-size:18px;color:var(--ok)">${TL(pT)}</b></div><div class="th"><span>Ödenmemiş</span><b style="font-size:18px;color:var(--red)">${TL(tot-pT)}</b></div><div class="th"><span>Kontörlü sipariş</span><b style="font-size:18px">${TL(kT)}</b></div></div>`;
 if(Object.keys(prod).length)h+=`<div class="tb"><b>Satış – ürün bazında</b><div class="lg" style="color:var(--mut);font-size:12.5px"><span style="flex:1">Ürün</span><span style="width:60px;text-align:right">Adet</span><span style="width:90px;text-align:right">Gelir</span></div>`+Object.entries(prod).sort((a,b)=>b[1].g-a[1].g).map(([n,r])=>`<div class="lg"><span style="flex:1">${esc(n)}</span><b style="width:60px;text-align:right">${r.q}</b><b style="width:90px;text-align:right">${TL(r.g)}</b></div>`).join('')+`<div class="lg" style="border-bottom:none;font-size:16px"><b style="flex:1">TOPLAM</b><b style="width:60px;text-align:right">${tq}</b><b class="sum" style="width:90px;text-align:right">${TL(tg)}</b></div></div>`;
 h+=os.length?os.slice().reverse().map(o=>`<div class="tb"><div class="th"><b style="font-size:18px">Masa ${esc(o.table)} · ${esc(o.no)}</b><span class="sum">${TL(o.total)}</span></div><small>${new Date(o.ms).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}</small> <span class="tag ${o.paid?'g':'r'}">${o.paid?'Ödendi':'Ödenmedi'}</span>${o.payType==='kontor'?' <span class="tag y">Kontör '+esc(o.phone)+'</span>':''}`+(o.items||[]).map(i=>`<div>${i.q} × ${esc(i.n)}${i.note?' <small>('+esc(i.note)+')</small>':''}</div>`).join('')+`</div>`).join(''):'<div class="hint">Bu gün sipariş yok.</div>';
 return h}
function members(){
 if(selId){const c=custs.find(x=>x.id===selId);if(!c){selId=null;return members()}
  const lg=(c.ledger||[]).slice().reverse().slice(0,30);
  return `<button id="back" style="border:none;background:none;color:var(--red);font-weight:700;padding:0 0 10px">‹ Üyeler</button><div class="tb"><div class="th"><b>${esc(c.name)}</b><span class="sum">${fk(c.k)}</span></div><small>${esc(c.phone)}</small><div class="ow"><input id="la" inputmode="decimal" placeholder="Yüklenecek kontör (1 = 10 ₺)"><div class="ac"><button class="p" id="load">Kontör yükle</button></div></div><hr style="border:none;border-top:1px dashed var(--line);margin:14px 0"><b>Veresiye kontör düş</b><input id="va" inputmode="decimal" placeholder="Düşülecek kontör"><input id="vn" placeholder="Not (isteğe bağlı)"><div class="ac"><button class="d" id="vere">Kontör düş</button></div><div class="ow"><hr style="border:none;border-top:1px dashed var(--line);margin:14px 0"><b>Kontör hakkı (eksiye düşebilir): ${fk(c.limit||0)}</b><input id="li" inputmode="decimal" placeholder="Hak miktarı, 0 = yok"><div class="ac"><button class="d" id="setlim">Hakkı kaydet</button></div></div></div><div class="tb"><b>Hareketler</b>`+(lg.map(x=>`<div class="lg"><div>${esc(x.d)}<br><small>${new Date(x.t).toLocaleString('tr-TR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</small></div><div class="${x.a>0?'neg':'pos'}">${x.a>0?'+':'−'}${fk(Math.abs(x.a))}</div></div>`).join('')||'<div class="hint">Hareket yok.</div>')+`</div>`}
 return `<div class="tb ow"><b>Yeni üye</b><input id="nn" placeholder="Ad soyad"><input id="np" inputmode="tel" placeholder="Telefon 05xx xxx xx xx"><input id="nk" inputmode="decimal" placeholder="Başlangıç kontörü" value="10"><div class="ac"><button class="p" id="addC">Üye ekle</button></div></div>`+(custs.slice().sort((a,b)=>a.name.localeCompare(b.name,'tr')).map(c=>`<div class="tb cu" data-cu="${esc(c.id)}"><div><b style="font-size:17px">${esc(c.name)}</b><br><small>${esc(c.phone)}</small></div><span class="sum">${fk(c.k)}${c.limit?'<br><small>hak '+fk(c.limit)+'</small>':''}</span></div>`).join('')||'<div class="hint">Henüz üye yok.</div>')}
function menuView(){const ks=Object.keys(PRICE),isAdd=k=>MO.add.some(a=>a.n===k);

async function msave(){const ks=Object.keys(PRICE),p={},off={};ks.forEach((k,i)=>{const v=parseFloat(String(document.getElementById('mp'+i).value).replace(',','.'));if(v>=0)p[k]=v;if(!document.getElementById('mo'+i).checked)off[k]=true});const add=MO.add.map(a=>({...a,p:p[a.n]!=null?p[a.n]:a.p}));const q={};Object.keys(p).forEach(k=>{if(!add.some(a=>a.n===k))q[k]=p[k]});try{await setDoc(doc(db,'menu','main'),{p:q,off,add});alert('Kaydedildi. Müşteri menüsü güncellendi.')}catch(x){alert(x.message)}}
function draw(){
 const keep=['nn','np','nk','la','li','va','vn'].map(i=>{const e=document.getElementById(i);return e?[i,e.value]:null}).filter(Boolean);
 const orders=docs.filter(d=>d.type==='order'),pays=docs.filter(d=>d.type==='payment'),declared=new Set(pays.map(p=>p.no+'|'+p.table)),open=orders.filter(o=>!o.paid),byT={};

 let h=`<div class="tabs"><button data-v="open" class="${view==='open'?'on':''}">Açık masalar (${Object.keys(byT).length})</button><button data-v="paid" class="${view==='paid'?'on':''}">Ödenenler</button><button data-v="day" class="ow ${view==='day'?'on':''}">Günlük</button><button data-v="mem" class="${view==='mem'?'on':''}">Üyeler</button><button data-v="menu" class="ow ${view==='menu'?'on':''}">Menü</button><button data-v="team" class="ow ${view==='team'?'on':''}">Ekip</button></div>`;
 if(view==='open'){

  ts.forEach(t=>{const os=byT[t].sort((a,b)=>a.ms-b.ms),norm=os.filter(o=>o.payType!=='kontor'),sum=os.reduce((s,o)=>s+o.total,0),nsum=norm.reduce((s,o)=>s+o.total,0),isNew=os.some(o=>o.status==='new'),dec=os.some(o=>declared.has(o.no+'|'+o.table));
   h+=`<div id="t-${esc(t.split(' ').reverse().join('-'))}" class="tb ${isNew?'new':''}"><div class="th"><b>Masa ${esc(t)}</b><span class="sum">${TL(sum)}</span></div>${dec?'<span class="tag y">Müşteri ödedi dedi (QR) – hesabı kontrol et</span>':''}`;
   os.forEach(o=>{const c=o.payType==='kontor'?byPhone(o.phone):null;
    h+=`<div class="o"><small>${esc(o.no)} · ${new Date(o.ms).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}</small> <span class="tag ${o.status==='new'?'r':'g'}">${o.status==='new'?'Yeni':'Hazırlandı'}</span>${o.payType==='kontor'?` <span class="tag y">Üye: ${c?esc(c.name)+' ('+fk(c.k)+')':'kayıtsız '+esc(o.phone)}</span>`:''}`+(o.items||[]).map(i=>`<div class="it">${i.q} × ${esc(i.n)}${i.note?' <small>('+esc(i.note)+')</small>':''}</div>`).join('')+`<div class="ac">${o.status==='new'?`<button class="d" data-a="done|${o.id}">Hazırlandı</button>`:''}${o.payType==='kontor'?`<button class="p" data-a="kd|${o.id}">Kontörden düş (${fk(o.total/KR)})</button>`:''}<button class="ow" data-a="del|${o.id}">Sil</button></div></div>`});
   if(norm.length)h+=`<div class="ac"><button class="p" data-a="tablepaid|${esc(t)}">Masa ${esc(t)} ödendi · ${TL(nsum)}</button></div>`;h+='</div>'});
 }else if(view==='paid'){
  const ps=orders.filter(o=>o.paid).sort((a,b)=>b.ms-a.ms).slice(0,60);

 }else if(view==='day'&&role==='owner')h+=dayView();else if(view==='menu'&&role==='owner')h+=menuView();else if(view==='team'&&role==='owner')h+=teamView();else h+=members();
 document.getElementById('w').innerHTML=h;
 keep.forEach(([i,v])=>{const e=document.getElementById(i);if(e)e.value=v});
